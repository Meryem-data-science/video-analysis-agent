[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-analysis-agent"
version = "0.1.0"
description = "Explainable multimodal video analysis agent for short-form content."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
  { name = "Video Analysis Agent contributors" },
]
keywords = ["video", "analysis", "vlm", "ffmpeg", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastmcp>=3.4,<4",
  "Pillow>=11,<14",
  "scenedetect>=0.6.5,<0.8",
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.1,<2",
  "librosa>=0.10.2,<0.12",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
]
gemini = [
  "google-genai>=1,<3",
]
pdf = [
  "reportlab>=4,<6",
]
web = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]
all = [
  "faster-whisper>=1.1,<2",
  "librosa>=0.10.2,<0.12",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "google-genai>=1,<3",
  "reportlab>=4,<6",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
video-agent = "video_agent.cli:main"
video-agent-run = "video_agent.cli:run_main"
video-agent-validate = "video_agent.cli:validate_main"

[tool.setuptools]
packages = ["video_agent", "video_agent.demo_assets", "scripts"]

[tool.setuptools.package-dir]
video_agent = "src/video_agent"
scripts = "scripts"

[tool.setuptools.package-data]
video_agent = ["*.example.json"]
"video_agent.demo_assets" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  ".venv-*",
  "outputs",
  "vidéos",
  "videos",
  "Flow_regeneration",
  "sap_fiori_dashboard",
  "_ocr_test",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
