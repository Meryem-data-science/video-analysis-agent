name: Bug report
description: Signaler un comportement reproductible de Video Analysis Agent
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Merci de retirer des logs toute vidéo, transcription, clé API, adresse,
        chemin personnel et autre donnée sensible avant de les joindre.
  - type: input
    id: os
    attributes:
      label: Système d’exploitation
      placeholder: "Windows 11 24H2, Ubuntu 24.04…"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Version Python
      description: Résultat de `python --version`.
      placeholder: "Python 3.13.2"
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: Version FFmpeg
      description: Première ligne de `ffmpeg -version`.
      placeholder: "ffmpeg version 7.x"
    validations:
      required: true
  - type: dropdown
    id: vlm_mode
    attributes:
      label: Mode VLM
      options:
        - manual
        - disabled
        - automatic / gemini
        - non applicable
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Inclure les commandes et le résultat observé, sans données sensibles.
      placeholder: |
        1. Installer…
        2. Exécuter…
        3. Observer…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs nettoyés
      description: Ne jamais inclure de clé, `.env`, chemin personnel, transcription ou média privé.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Vérification de confidentialité
      options:
        - label: J’ai supprimé toute donnée sensible des informations fournies.
          required: true
